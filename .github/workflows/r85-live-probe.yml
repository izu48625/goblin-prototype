name: R85 One-Time Live Examples Navigation Verification
on:
  pull_request:
    paths:
      - '.github/workflows/r85-live-probe.yml'
      - 'scripts/r85-live-check-one-time.mjs'
permissions:
  contents: read
jobs:
  production-link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read-only HTTP verification against real Stats Maker
        run: node scripts/r85-live-check-one-time.mjs
