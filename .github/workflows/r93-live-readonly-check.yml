name: R93 GET-only My Works live light-mode audit
on:
  push:
    branches: [r93-live-readonly-check-20261028]
    paths:
      - 'scripts/r93-live-readonly-check.mjs'
      - '.github/workflows/r93-live-readonly-check.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GET-only check light-first My Works deployed assets
        run: node scripts/r93-live-readonly-check.mjs
