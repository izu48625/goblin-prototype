concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

name: R78 Compact Scoring Header
on:
  pull_request:
    paths:
      - 'base/index.html'
      - 'base/css/r78-compact-header.css'
      - 'scripts/r78-*.mjs'
      - '.github/workflows/r78-compact-header-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compact-header-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static content, data, ads and CSS scope
        run: |
          node scripts/r78-compact-static-qa.mjs
          node scripts/r77-editor-light-static-qa.mjs
          node scripts/r76-editor-hierarchy-static-qa.mjs
          npm run build:cloudflare
          test -s dist/base/css/r78-compact-header.css
      - name: Install browsers
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Serve static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r78-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Chrome/WebKit actual UI geometry and editor behavior at 320-1180
        run: node scripts/r78-compact-browser-qa.mjs
