name: Cloudflare Preflight

on:
  pull_request:
    paths:
      - "index.html"
      - "base/**"
      - "app/**"
      - "scripts/r118-public-visuals-qa.mjs"
      - "cloud/**"
      - "css/**"
      - "js/**"
      - "discover.html"
      - "public.html"
      - "rate.html"
      - "my.html"
      - "worker/**"
      - "tests/og-image.test.mjs"
      - "scripts/build-cloudflare.mjs"
      - "scripts/production-smoke.mjs"
      - "scripts/r26-edge-test.mjs"
      - "scripts/r26-gateway-test.mjs"
      - "scripts/r26-client-gateway-test.mjs"
      - "scripts/r27-community-visual-test.mjs"
      - "scripts/r27-community-home-test.mjs"
      - "scripts/r27-remix-copy-test.mjs"
      - "scripts/r28-publish-lifecycle-test.mjs"
      - "scripts/r29-backup-restore-test.mjs"
      - "scripts/r29-source-link-safety-test.mjs"
      - "scripts/r29-mobile-backup-ui-test.mjs"
      - "scripts/r30-storage-and-max-data-qa.mjs"
      - "scripts/r30-home-corrupt-recovery-qa.mjs"
      - ".github/workflows/production-smoke.yml"
      - "R29_P2_INTERNAL_HOOK_EXECUTE_RESTRICT.sql"
      - "R29_P2_INTERNAL_HOOK_EXECUTE_ROLLBACK.sql"
      - "R29_P2_INTERNAL_HOOK_ACL_AUDIT.md"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/cloudflare-preflight.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "base/**"
      - "app/**"
      - "cloud/**"
      - "css/**"
      - "js/**"
      - "discover.html"
      - "public.html"
      - "rate.html"
      - "my.html"
      - "worker/**"
      - "tests/og-image.test.mjs"
      - "scripts/build-cloudflare.mjs"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/cloudflare-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check worker/index.js
          node --check worker/og-image.js
          node --check tests/og-image.test.mjs
          node --check worker/community-gateway.js
          node --check scripts/r26-gateway-test.mjs
          node --check scripts/r26-client-gateway-test.mjs
          node --check cloud/community-gateway.js
          node --check scripts/r26-edge-test.mjs
          node --check scripts/build-cloudflare.mjs
          node --check scripts/production-smoke.mjs
          node --check base/js/app.js
          node --check cloud/public.js
          node --check cloud/discover.js
          node --check cloud/rate.js
          node --check cloud/global-locale.js
          node --check app/src/core/i18n.js
          node --check app/src/core/export.js
          node --check app/src/editor/editor.js
          node --check cloud/rate-visuals.js
          node --check cloud/community-home.js
          node --check cloud/community-rating-model.js
          node --check scripts/r27-community-home-test.mjs
          node --check scripts/r27-community-visual-test.mjs
          node --check cloud/remix.js
          node --check scripts/r27-remix-copy-test.mjs
          node --check scripts/r28-publish-lifecycle-test.mjs
          node --check scripts/r29-backup-restore-test.mjs
          node --check scripts/r29-source-link-safety-test.mjs
          node --check app/src/core/source-sync.js
          node --check scripts/r29-mobile-backup-ui-test.mjs
          node --check scripts/r29-home-backup-undo-qa.mjs
          node --check scripts/r30-storage-and-max-data-qa.mjs
          node --check scripts/r30-home-corrupt-recovery-qa.mjs
          node --check app/src/launcher.js
          node --check cloud/public-extensions.js
          node --check app/src/extension-catalog.js
          node --check scripts/r118-public-visuals-qa.mjs
      - name: Cloudflare-only OG PNG tests
        run: node --test tests/og-image.test.mjs
      - name: R26 edge guard test
        run: node scripts/r26-edge-test.mjs
      - name: R26 Turnstile gateway test
        run: node scripts/r26-gateway-test.mjs
      - name: R26 browser gateway fail-closed test
        run: node scripts/r26-client-gateway-test.mjs
      - name: R27 Community visuals snapshot test
        run: node scripts/r27-community-visual-test.mjs
      - name: R27 shared Home/Community rating identity test
        run: node scripts/r27-community-home-test.mjs
      - name: R27 copied-sheet title and lineage regression test
        run: node scripts/r27-remix-copy-test.mjs
      - name: R29 safe project-backup import and persistence
        run: node scripts/r29-backup-restore-test.mjs

      - name: R29 orphaned chart source isolation and restore
        run: node scripts/r29-source-link-safety-test.mjs
      - name: R30 fail-closed chart persistence and max 40x10 data
        run: node scripts/r30-storage-and-max-data-qa.mjs
      - name: R118 Public Visual Tools creator snapshot regression
        run: node scripts/r118-public-visuals-qa.mjs
      - name: Build static bundle
        run: npm run build:cloudflare
      - name: Verify required assets
        run: |
          test -f dist/index.html
          test -f dist/base/index.html
          test -f dist/app/editor.html
          test -f dist/discover.html
          test -f dist/public.html
          test -f dist/rate.html
          test -f dist/cloud/supabase.js
          test -f dist/cloud/community-gateway.js
          test -f dist/cloud/community-home.js
          test -f dist/cloud/global-locale.js
          test -f dist/cloud/global-locale.css
          test -f dist/cloud/community-rating-model.js
          test -f dist/cloud/runtime-config.js
      - name: Verify no private server files are published
        run: |
          test ! -e dist/server
          test ! -e dist/api
          test ! -e dist/.github
          test ! -e dist/R18_SUPABASE_MIGRATION.sql
