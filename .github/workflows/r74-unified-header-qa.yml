concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

name: R74 Single Header and Scoring Palette
on:
  pull_request:
    paths:
      - 'cloud/global-locale.js'
      - 'cloud/r73-reading.css'
      - 'base/css/r74-score-harmony.css'
      - 'base/index.html'
      - 'ja/**'
      - 'en/**'
      - 'scripts/r74-*.mjs'
      - 'scripts/r73-theme-static-qa.mjs'
      - '.github/workflows/r74-unified-header-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified-header-and-scoring:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only content and CSS regressions
        run: |
          node --check cloud/global-locale.js
          node scripts/r74-header-score-static-qa.mjs
          node scripts/r73-theme-static-qa.mjs
          node scripts/r72-readiness-qa.mjs
          npm run build:cloudflare
          test -s dist/cloud/r73-reading.css
          test -s dist/base/css/r74-score-harmony.css
      - name: Install browser engines
        run: |
          npm install --no-save playwright@1.56.1
      - name: Serve static bundle
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r74-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ja/chart-guide.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Check mobile & desktop, contrast, locale, heat score invariants
        run: node scripts/r74-header-score-browser-qa.mjs
