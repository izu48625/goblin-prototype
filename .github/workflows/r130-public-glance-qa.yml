name: R130 Public Comparison First-View QA
on:
  pull_request:
    paths:
      - 'public.html'
      - 'cloud/public.js'
      - 'cloud/public.css'
      - 'scripts/r130-public-glance-qa.mjs'
      - '.github/workflows/r130-public-glance-qa.yml'
  push:
    branches: [main]
    paths:
      - 'public.html'
      - 'cloud/public.js'
      - 'cloud/public.css'
      - 'scripts/r130-public-glance-qa.mjs'
      - '.github/workflows/r130-public-glance-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cloud/public.js
      - run: node --check scripts/r130-public-glance-qa.mjs
      - run: node scripts/r130-public-glance-qa.mjs
      - run: node scripts/r118-public-visuals-qa.mjs
      - run: npm run build:cloudflare
      - run: test -f dist/public.html && test -f dist/cloud/public.js && test -f dist/cloud/public.css
