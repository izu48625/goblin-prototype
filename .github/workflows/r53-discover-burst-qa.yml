name: R53 Discover Burst and Visibility Safety
on:
  pull_request:
    paths:
      - 'worker/discover-public.js'
      - 'scripts/r53-discover-burst-qa.mjs'
      - 'scripts/r43-discover-gateway-qa.mjs'
      - '.github/workflows/r53-discover-burst-qa.yml'
      - 'R53_DISCOVER_SCALE_QA.md'
  push:
    branches: [main]
    paths:
      - 'worker/discover-public.js'
      - 'scripts/r53-discover-burst-qa.mjs'
      - '.github/workflows/r53-discover-burst-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  burst-and-revocation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check worker/discover-public.js && node --check scripts/r53-discover-burst-qa.mjs
      - name: R43 Public-only and historical safety baseline
        run: node scripts/r43-discover-gateway-qa.mjs
      - name: R53 50-concurrent isolation burst, revocation, error recovery
        run: node scripts/r53-discover-burst-qa.mjs
      - name: Verify static and dynamic bundles
        run: npm run build:cloudflare
