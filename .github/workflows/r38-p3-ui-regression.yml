name: R38 P3 Home Tiles Intro and Publish Title QA
on:
  pull_request:
    paths:
      - "base/**"
      - "cloud/global-locale.*"
      - "cloud/public.js"
      - "cloud/public.css"
      - "public.html"
      - "index.html"
      - "discover.html"
      - "my.html"
      - "public.html"
      - "rate.html"
      - "app/editor.html"
      - "ja/**"
      - "en/**"
      - "scripts/r38-p3-ui-regression-qa.mjs"
      - "scripts/r38-p6-scale-mode-qa.mjs"
      - "scripts/r38-p15-public-score-qa.mjs"
      - ".github/workflows/r38-p3-ui-regression.yml"
  push:
    branches: [main]
    paths:
      - "base/**"
      - "cloud/global-locale.*"
      - "cloud/public.js"
      - "cloud/public.css"
      - "public.html"
      - "index.html"
      - "discover.html"
      - "my.html"
      - "public.html"
      - "rate.html"
      - "app/editor.html"
      - "ja/**"
      - "en/**"
      - "scripts/r38-p3-ui-regression-qa.mjs"
      - "scripts/r38-p6-scale-mode-qa.mjs"
      - "scripts/r38-p15-public-score-qa.mjs"
      - ".github/workflows/r38-p3-ui-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and syntax
        run: |
          node --check base/js/app.js
          node --check base/js/i18n.js
          node --check cloud/global-locale.js
          node --check scripts/r38-p3-ui-regression-qa.mjs
          node --check scripts/r38-p6-scale-mode-qa.mjs
          node --check cloud/public.js
          node --check scripts/r38-p15-public-score-qa.mjs
          npm run build:cloudflare
      - name: Install isolated browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Serve static build without production DB access
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r38p3.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: QA score colors, responsive language link, blocked unnamed publish
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node scripts/r38-p3-ui-regression-qa.mjs
          BROWSER_ENGINE=webkit node scripts/r38-p3-ui-regression-qa.mjs
          node scripts/r38-p6-scale-mode-qa.mjs
          BROWSER_ENGINE=webkit node scripts/r38-p6-scale-mode-qa.mjs
          node scripts/r38-p15-public-score-qa.mjs
          BROWSER_ENGINE=webkit node scripts/r38-p15-public-score-qa.mjs
