name: R129 Public Crawlability Audit
on:
  push:
    branches: [main]
    paths:
      - 'ja/index.html'
      - 'en/index.html'
      - 'scripts/r129-public-crawlability-qa.mjs'
      - '.github/workflows/r129-public-crawlability-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check scripts/r129-public-crawlability-qa.mjs
      - name: Check public robots, sitemaps, works, populated categories
        env:
          BASE_URL: https://statsmaker.app
        run: node scripts/r129-public-crawlability-qa.mjs
