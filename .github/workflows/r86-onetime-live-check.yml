name: R86 Temporary Read-Only Live Copy Check
on:
  pull_request:
    paths:
      - 'scripts/r86-onetime-live-check.mjs'
      - '.github/workflows/r86-onetime-live-check.yml'
permissions:
  contents: read
jobs:
  check-live-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read-only verify live site uses new copy
        run: node scripts/r86-onetime-live-check.mjs
