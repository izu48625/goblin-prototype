concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

name: R60 Discover Fused Counts Isolated Comparison
on:
  pull_request:
    paths:
      - 'R60_DISCOVER_FUSED_COUNTS_HELPER.sql'
      - 'R60_DISCOVER_FUSED_COUNTS_RPC_CANDIDATE.sql'
      - 'scripts/r60-fused-counts-parity-qa.sql'
      - '.github/workflows/r60-discover-fused-counts-benchmark.yml'
      - 'R60_FUSED_COUNTS_EVALUATION.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  topk-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: "R60 before/after ${{ matrix.works }} works"
    strategy:
      fail-fast: false
      matrix:
        works: [1000, 10000, 50000, 100000]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test_only_not_a_production_secret
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only_not_a_production_secret
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Check synthetic fixture only
        run: |
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = postgres
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_DB_URL:-}"
          bash scripts/r58-p4-fixture.sh "${{ matrix.works }}"
      - name: Install current R59 RPC in disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f R59_DISCOVER_TOPK_RPC_CANDIDATE.sql
      - name: Baseline R59 load (unchanged)
        run: |
          python3 scripts/r58-p4-load.py "${{ matrix.works }}"
          mv "artifacts/r58-p4-load-${{ matrix.works }}.json" "artifacts/r60-baseline-${{ matrix.works }}.json"
      - name: 32 JSON parity plus helper/privacy checks; install R60
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/r60-fused-counts-parity-qa.sql
      - name: R60 candidate load on same synthetic fixture
        run: |
          python3 scripts/r58-p4-load.py "${{ matrix.works }}"
          mv "artifacts/r58-p4-load-${{ matrix.works }}.json" "artifacts/r60-fused-${{ matrix.works }}.json"
      - name: Compare baseline vs R60 by query type
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          size=int("${{ matrix.works }}")
          a=json.loads(Path(f"artifacts/r60-baseline-{size}.json").read_text())
          b=json.loads(Path(f"artifacts/r60-fused-{size}.json").read_text())
          f=open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8')
          f.write(f"### R60 paired counts matched fixture: {size:,} topics\n\n")
          f.write("Same runner, same fixture; **sequential non-randomized measurements**, not direct production timing.\n\n")
          f.write("|Concurrency|R59 p95 ms|R60 p95 ms|Difference|R59 errors|R60 errors|\n|--:|--:|--:|--:|--:|--:|\n")
          for p in (1,5,20,50):
              x=a["concurrency"][str(p)];y=b["concurrency"][str(p)]
              improvement=round((1-y["wall_p95_ms"]/x["wall_p95_ms"])*100,1)
              print(f"R59 {size} topics / {p} parallel: old={x['wall_p95_ms']}ms new={y['wall_p95_ms']}ms change={improvement}% errors={y['errors']}",flush=True)
              f.write(f"|{p}|{x['wall_p95_ms']}|{y['wall_p95_ms']}|{improvement:+.1f}%|{x['errors']}|{y['errors']}|\n")
              if y["errors"]: raise SystemExit(f"Unexpected errors for {size}/{p}")
          f.write("\nPer-query JSON includes mixed search/category/popular/community cases; CPU spot samples are best-effort.\n")
          f.close()
          PY
      - name: Save baseline and optimized results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r60-fused-comparison-${{ matrix.works }}
          path: artifacts/r60-*.json
          if-no-files-found: warn
          retention-days: 14
