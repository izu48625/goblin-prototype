name: R81 Readable Settings and Light Dark Toggle
on:
  pull_request:
    paths:
      - 'base/index.html'
      - 'base/js/r80-scoring-first.js'
      - 'base/css/r81-clear-settings.css'
      - 'cloud/global-locale.js'
      - 'cloud/r81-theme.css'
      - 'app/editor.html'
      - 'scripts/r80-*.mjs'
      - 'scripts/r81-*.mjs'
      - '.github/workflows/r81-mobile-theme-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-theme-and-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Code and privacy invariant
        run: |
          node scripts/r81-settings-static-qa.mjs
          node scripts/r80-scoring-first-static-qa.mjs
          node --check cloud/global-locale.js
          node --check base/js/r80-scoring-first.js
          npm run build:cloudflare
          test -s dist/cloud/r81-theme.css
          test -s dist/base/css/r81-clear-settings.css
      - name: Install browsers
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Serve local build
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r81-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Chromium and WebKit mobile/desktop journey
        run: |
          node scripts/r81-settings-browser-qa.mjs
          node scripts/r80-scoring-first-browser-qa.mjs
