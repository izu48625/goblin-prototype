name: R58 P1 Public Payload Projection QA

on:
  pull_request:
    paths:
      - 'cloud/public.js'
      - 'public.html'
      - 'scripts/r58-public-projection-qa.mjs'
      - 'scripts/r38-p4-live-palette-qa.mjs'
      - '.github/workflows/r38-p4-live-palette.yml'
      - '.github/workflows/r58-public-projection-qa.yml'
      - 'R58_P1_PAYLOAD_AUDIT.md'
  push:
    branches: [main]
    paths:
      - 'cloud/public.js'
      - 'public.html'
      - 'scripts/r58-public-projection-qa.mjs'
      - '.github/workflows/r58-public-projection-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-mock-and-privacy:
    name: No wildcard, mock RLS/Community, iPhone-like Chromium/WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and deployable assets
        run: |
          node --check cloud/public.js
          node --check scripts/r58-public-projection-qa.mjs
          node --check scripts/r38-p4-live-palette-qa.mjs
          npm run build:cloudflare
          test -s dist/cloud/public.js
          grep -q 'r58p1projection1' dist/public.html
          test -s dist/ads.txt
          grep -Fx 'google.com, pub-2734957009365610, DIRECT, f08c47fec0942fa0' dist/ads.txt
      - name: Install isolated browser QA
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Run isolated mock browser QA, never writes production data
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r58-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/public.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/r58-public-projection-qa.mjs
          BROWSER_ENGINE=webkit node scripts/r58-public-projection-qa.mjs
          node scripts/r38-p15-public-score-qa.mjs
          BROWSER_ENGINE=webkit node scripts/r38-p15-public-score-qa.mjs
          node scripts/r37-visibility-ui-qa.mjs
          node scripts/r38-p17-prelaunch-readonly-qa.mjs local
          node scripts/r38-p4-live-palette-qa.mjs
