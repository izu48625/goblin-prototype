name: R130 Live Public Comparison Browser QA
on:
  pull_request:
    paths:
      - 'scripts/r130-live-public-comparison-qa.mjs'
      - '.github/workflows/r130-live-public-comparison-qa.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/r130-live-public-comparison-qa.mjs'
      - '.github/workflows/r130-live-public-comparison-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/r130-live-public-comparison-qa.mjs
      - name: Install compatible browser driver
        if: github.event_name != 'pull_request'
        run: npm install --no-save playwright@1.56.1
      - name: Verify real Public work preview on iPhone and desktop widths
        if: github.event_name != 'pull_request'
        env:
          BASE_URL: https://statsmaker.app
        run: node scripts/r130-live-public-comparison-qa.mjs
