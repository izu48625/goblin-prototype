name: R87 AdSense Real Content & Security QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'discover.html'
      - 'worker/seo.js'
      - 'scripts/r34-seo-edge-test.mjs'
      - 'scripts/r87-*.mjs'
      - '.github/workflows/r87-adsense-qa.yml'
permissions:
  contents: read
jobs:
  content-review:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build Cloudflare Free static bundle and install browsers
        run: |
          npm run build:cloudflare
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Start isolated localhost test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r87.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ja/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Public SSR safety and static useful-content audits
        run: |
          node scripts/r87-content-static-qa.mjs
          node scripts/r34-seo-edge-test.mjs
          node scripts/r84-native-usecases-qa.mjs
          node scripts/r70-adsense-content-qa.mjs
          node scripts/r83-scoring-guide-qa.mjs
          node scripts/r47-seo-guides-qa.mjs
      - name: Check actual Home/Discover in mobile WebKit and Chromium
        run: node scripts/r87-content-browser-qa.mjs
