name: R38 P4 Live Home Palette Cache Gate
on:
  pull_request:
    paths:
      - "index.html"
      - "base/index.html"
      - "base/css/style.css"
      - "cloud/public.css"
      - "cloud/public.js"
      - "public.html"
      - "scripts/r38-p4-live-palette-qa.mjs"
      - ".github/workflows/r38-p4-live-palette.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "base/index.html"
      - "base/css/style.css"
      - "cloud/public.css"
      - "cloud/public.js"
      - "public.html"
      - "scripts/r38-p4-live-palette-qa.mjs"
      - ".github/workflows/r38-p4-live-palette.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate cache keys and palette without writing user data
        run: |
          node --check scripts/r38-p4-live-palette-qa.mjs
          node scripts/r38-p4-live-palette-qa.mjs
          npm run build:cloudflare
          grep -q 'base/index.html?v=r38p15scores1' dist/index.html
          grep -q 'css/style.css?v=r38p15scores1' dist/base/index.html
          grep -q 'js/i18n.js?v=r38p15scores1' dist/base/index.html
          grep -q 'cloud/public.css?v=r58p1projection1' dist/public.html
          grep -q 'cloud/public.js?v=r58p1projection1' dist/public.html
  deployed-chain:
    if: github.event_name != 'pull_request'
    needs: source-chain
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live Cloudflare and GitHub Pages actually serve latest palette
        run: node scripts/r38-p4-live-palette-qa.mjs live
