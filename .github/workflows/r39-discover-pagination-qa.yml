name: R39 Discover pagination QA
on:
  pull_request:
  push:
    branches: [main]
jobs:
  discover-pagination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cloud/discover.js
      - run: node scripts/r39-discover-pagination-qa.mjs
