name: R134 Dynamic Production Smoke Topic QA
on:
  pull_request:
    paths:
      - 'scripts/r134-production-smoke-topic.mjs'
      - 'scripts/r134-production-smoke-qa.mjs'
      - 'scripts/production-smoke.mjs'
      - 'scripts/r28-publish-lifecycle-test.mjs'
      - 'scripts/r138-publish-mock-security-qa.mjs'
      - 'security/R136_INTERNAL_FUNCTION_EXECUTE_RESTRICTION.sql'
      - 'scripts/r135-smoke-remix-title-qa.mjs'
      - '.github/workflows/production-smoke.yml'
      - '.github/workflows/r134-smoke-topic-qa.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/r134-production-smoke-topic.mjs'
      - 'scripts/r134-production-smoke-qa.mjs'
      - 'scripts/production-smoke.mjs'
      - 'scripts/r28-publish-lifecycle-test.mjs'
      - 'scripts/r138-publish-mock-security-qa.mjs'
      - 'security/R136_INTERNAL_FUNCTION_EXECUTE_RESTRICTION.sql'
      - 'scripts/r135-smoke-remix-title-qa.mjs'
      - '.github/workflows/production-smoke.yml'
      - '.github/workflows/r134-smoke-topic-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selection-and-consent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/production-smoke.mjs
      - run: node --check scripts/r134-production-smoke-topic.mjs
      - run: node --check scripts/r134-production-smoke-qa.mjs
      - run: node scripts/r134-production-smoke-qa.mjs
      - run: node scripts/r135-smoke-remix-title-qa.mjs
      - run: node scripts/r138-publish-mock-security-qa.mjs
