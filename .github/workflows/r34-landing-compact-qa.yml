concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

name: R34 Compact JA-EN Landing Navigation QA
on:
  pull_request:
    paths:
      - "en/index.html"
      - "ja/index.html"
      - "cloud/global-locale.js"
      - "ROADMAP_R31_PLUS.md"
      - "SEO_R34.md"
      - "scripts/r34-landing-compact-qa.mjs"
      - ".github/workflows/r34-landing-compact-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-localized-landing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate syntax and original SEO index protections
        run: |
          node --check cloud/global-locale.js
          node --check scripts/r34-landing-compact-qa.mjs
          node scripts/r34-seo-edge-test.mjs
      - name: Build Cloudflare static pages
        run: npm run build:cloudflare
      - name: Install isolated Chromium browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test responsive cards, common nav, language toggling and sitemap task
        run: |
          python3 -m http.server 8765 --directory dist > /tmp/r34-landing.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID || true' EXIT
          sleep 2
          BASE_URL=http://127.0.0.1:8765 node scripts/r34-landing-compact-qa.mjs
