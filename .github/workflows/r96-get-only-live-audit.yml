name: R96 one-time GET-only Public content audit
on:
  push:
    branches: [r96-get-only-live-audit-20261028]
    paths:
      - 'scripts/r96-get-only-live-audit.mjs'
      - '.github/workflows/r96-get-only-live-audit.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GET-only 11 Public works, original summaries, privacy and 14 editorials
        run: node scripts/r96-get-only-live-audit.mjs
