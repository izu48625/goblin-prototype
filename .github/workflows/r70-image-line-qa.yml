concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

name: R70 Image Line QA
on:
  pull_request:
    paths:
      - "app/src/**"
      - "app/editor.html"
      - "app/css/editor.css"
      - "index.html"
      - "scripts/r70-image-line-qa.mjs"
      - "scripts/r70-image-line-browser-qa.mjs"
      - ".github/workflows/r70-image-line-qa.yml"
  workflow_dispatch:

jobs:
  image-line:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript syntax
        run: |
          node --check app/src/core/image-line.js
          node --check app/src/core/export.js
          node --check app/src/core/project.js
          node --check app/src/core/source-sync.js
          node --check app/src/editor/editor.js
          node --check app/src/visualizations/image-line.js
          node --check app/src/visualizations/registry.js
          node --check app/src/launcher.js
      - name: Functional QA
        run: node scripts/r70-image-line-qa.mjs
      - name: Browser acceptance on built static site
        run: |
          npm run build:cloudflare
          npm install --no-save playwright@1.56.1
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r70-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4173 node scripts/r70-image-line-browser-qa.mjs
