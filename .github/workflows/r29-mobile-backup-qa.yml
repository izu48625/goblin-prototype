name: R29 Mobile Backup UI QA

on:
  pull_request:
    paths:
      - "app/css/editor.css"
      - "app/editor.html"
      - "scripts/r29-mobile-backup-ui-test.mjs"
      - "scripts/r30-home-corrupt-recovery-qa.mjs"
      - ".github/workflows/r29-mobile-backup-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build local Cloudflare static files
        run: npm run build:cloudflare
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test iPhone backup UI against local PR build (no DB writes)
        run: |
          python3 -m http.server 8765 --directory dist >/tmp/r29-backup-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          BASE_URL=http://127.0.0.1:8765 node scripts/r29-mobile-backup-ui-test.mjs
          BASE_URL=http://127.0.0.1:8765 node scripts/r30-home-corrupt-recovery-qa.mjs
