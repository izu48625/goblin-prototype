name: One-Time AdSense Site Readiness Read-Only Audit
on:
  pull_request:
    paths:
      - 'scripts/adsense-onetime-readonly.mjs'
      - '.github/workflows/adsense-onetime-audit.yml'
permissions:
  contents: read
jobs:
  live-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: HTTP check public site, public works, policy pages, sitemaps and publisher registration
        run: node scripts/adsense-onetime-readonly.mjs
