concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

name: R82 Dark Scoring Palette Regression
on:
  pull_request:
    paths:
      - 'cloud/global-locale.js'
      - 'cloud/r82-dark-harmony.css'
      - 'scripts/r82-*.mjs'
      - 'scripts/r81-settings-browser-qa.mjs'
      - '.github/workflows/r82-dark-harmony-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-browser-dark-light:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks and build
        run: |
          node scripts/r82-dark-harmony-static-qa.mjs
          node --check cloud/global-locale.js
          npm run build:cloudflare
          test -s dist/cloud/r82-dark-harmony.css
      - name: Install WebKit and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r82-site.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: iPhone and desktop contrast and score invariants
        run: node scripts/r82-dark-harmony-browser-qa.mjs
