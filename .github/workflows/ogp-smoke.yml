name: OGP Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "api/**"
      - "cloud/runtime-config.js"
      - "cloud/public.js"
      - "public.html"
      - ".github/workflows/ogp-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://statsmaker.app
      PUBLIC_TOPIC_ID: 57b432ed-fbf2-4261-b57d-9e0f27356d2e

    steps:
      - name: Verify Cloudflare share metadata
        shell: bash
        run: |
          set -euo pipefail
          SHARE_URL="$BASE_URL/p/$PUBLIC_TOPIC_ID"
          for attempt in $(seq 1 12); do
            CODE="$(curl -L -sS --max-time 20 -o /tmp/share.html -w '%{http_code}' "$SHARE_URL" || true)"
            if [ "$CODE" = "200" ] && grep -q 'property="og:title"' /tmp/share.html; then
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo "::error::Cloudflare OGP share route did not become ready: HTTP $CODE"
              exit 1
            fi
            sleep 5
          done
          grep -q 'property="og:title"' /tmp/share.html
          grep -q 'property="og:description"' /tmp/share.html
          grep -q 'property="og:image"' /tmp/share.html
          grep -q 'name="twitter:card" content="summary_large_image"' /tmp/share.html
          grep -Fq "$BASE_URL/public.html?id=$PUBLIC_TOPIC_ID" /tmp/share.html
          grep -Fq "$BASE_URL/api/og?id=$PUBLIC_TOPIC_ID" /tmp/share.html
          echo "Share metadata PASS: $SHARE_URL"

      - name: Verify Cloudflare 1200x630 PNG
        shell: bash
        run: |
          set -euo pipefail
          OG_URL="$BASE_URL/api/og?id=$PUBLIC_TOPIC_ID"
          curl -fsSL --retry 3 --max-time 30 -D /tmp/og.headers -o /tmp/og.png "$OG_URL"
          grep -Eiq '^content-type: image/png' /tmp/og.headers
          python3 - <<'PY'
          import struct
          from pathlib import Path
          image=Path("/tmp/og.png").read_bytes()
          if image[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Cloudflare OGP did not return PNG")
          width,height=struct.unpack(">II",image[16:24])
          if (width,height)!=(1200,630):
              raise SystemExit(f"Unexpected Cloudflare OGP dimensions: {width}x{height}")
          print(f"Cloudflare OGP PNG PASS: {width}×{height}")
          PY

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Stats Maker Cloudflare OGP Audit"
            echo "- Public topic: \`$PUBLIC_TOPIC_ID\`"
            echo "- Canonical work URL on statsmaker.app: PASS"
            echo "- Per-work OpenGraph metadata: PASS"
            echo "- Twitter large-image card: PASS"
            echo "- Cloudflare OGP image: PASS (1200×630 PNG)"
            echo "- Unused Vercel deployment: not required"
          } >> "$GITHUB_STEP_SUMMARY"
