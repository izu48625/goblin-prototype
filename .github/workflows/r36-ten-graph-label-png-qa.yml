name: R36 Ten Graph Label and PNG QA
on:
  pull_request:
    paths:
      - "app/css/editor.css"
      - "app/editor.html"
      - "app/src/editor-entry.js"
      - "app/src/editor/editor.js"
      - "app/src/visualizations/**"
      - "app/src/core/export.js"
      - "scripts/r36-ten-graph-label-png-qa.mjs"
      - ".github/workflows/r36-ten-graph-label-png-qa.yml"
      - "ROADMAP_R31_PLUS.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-ten-chart-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and isolated static bundle
        run: |
          node --check app/src/visualizations/scatter.js
          node --check app/src/visualizations/radar.js
          node --check app/src/core/export.js
          node --check app/src/editor/editor.js
          node --check scripts/r36-ten-graph-label-png-qa.mjs
          npm run build:cloudflare
          grep -q 'editor.css?v=r70imageline1' dist/app/editor.html
      - name: Browser render ten visible chart types and encode iPhone PNGs
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r36-graphs-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4173 node scripts/r36-ten-graph-label-png-qa.mjs
