<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101f">
  <meta name="description" content="Browse free public rankings, rating charts, anime and sports comparisons, tier lists, and community ratings on Stats Maker. 公開作品を探す。">
  <title>Discover Free Rating Charts & Rankings | Stats Maker</title>
  <link rel="canonical" href="https://statsmaker.app/discover">
  <meta name="robots" content="index,follow">
  <script>
/* R34 localized landing links must open the real app in the chosen language. */
try{
 const language=new URLSearchParams(location.search).get('lang');
 if(language==='en'||language==='ja'){
   localStorage.setItem('statsMaker.locale',language);
   localStorage.setItem('statsMakerV2Language',language);
 }
}catch{}
</script>

</head>
<body data-build="R25-P3" data-sm-ad-page="discover">
  <div class="wrap">
    <header class="top">
      <a class="brand" href="index.html?v=r25p3" aria-label="Stats Maker">
        <div class="mark">S</div>
        <span>STATS MAKER</span>
      </a>
      <div class="topActions">
        
        <a class="createLink" href="index.html?v=r25p3">＋ 作る</a>
      </div>
    </header>

    <section class="hero">
      <div class="eyebrow">DISCOVER</div>
      <h1>みんなのStatsを見つける</h1>
      <p>公開された評価シートを検索して、結果を見たりRemixしたりできます。</p>
      <div class="privacyNote">Public作品のみ掲載。URL限定（Unlisted）はここには表示されません。</div>
    </section>

    <nav class="browseTabs" aria-label="Browse mode">
      <button class="browseTab active" data-view="all" type="button">すべての作品</button>
      <button class="browseTab" data-view="community" type="button">みんなで評価</button>
    </nav>

    <div class="categoryRail" aria-label="カテゴリ">
      <button class="categoryBtn active" data-category="all" type="button">すべて</button>
      <button class="categoryBtn" data-category="sports" type="button">スポーツ</button>
      <button class="categoryBtn" data-category="manga_anime" type="button">漫画・アニメ</button>
      <button class="categoryBtn" data-category="movie_tv" type="button">映画・ドラマ</button>
      <button class="categoryBtn" data-category="food" type="button">フード</button>
      <button class="categoryBtn" data-category="game" type="button">ゲーム</button>
      <button class="categoryBtn" data-category="music" type="button">音楽</button>
      <button class="categoryBtn" data-category="books" type="button">本・文学</button>
      <button class="categoryBtn" data-category="travel" type="button">旅行・場所</button>
      <button class="categoryBtn" data-category="tech" type="button">テクノロジー</button>
      <button class="categoryBtn" data-category="lifestyle" type="button">ライフ・趣味</button>
      <button class="categoryBtn" data-category="other" type="button">その他</button>
    </div>

    <section class="controls">
      <label class="searchBox">
        <span>⌕</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="タイトル・説明・対象・評価項目を検索">
      </label>
      <div class="sortTabs" role="tablist" aria-label="並び順">
        <button class="sortBtn active" data-sort="newest" type="button">新着</button>
        <button class="sortBtn" data-sort="popular" type="button">人気</button>
        <button class="sortBtn" data-sort="community" type="button">Community</button>
        <button class="sortBtn" data-sort="remix" type="button">Remix</button>
      </div>
    </section>

    <div class="resultHead">
      <div>
        <div id="sectionTitle" class="sectionTitle">すべての作品</div>
        <div id="resultMeta" class="resultMeta">読み込み中…</div>
      </div>
      <button id="refreshBtn" class="refreshBtn" type="button">更新</button>
    </div>

    <div id="status" class="status">公開作品を読み込んでいます…</div>
    <main id="grid" class="discoverGrid hidden"></main>
    <button id="moreBtn" class="moreBtn hidden" type="button">さらに表示</button>

    <footer class="footer">
      <span>Stats Maker Discover</span>
      <a href="index.html?v=r25p3">自分のStatsを作る</a>
        <a href="/ja/legal.html#terms" data-sm-legal-link="terms">利用規約</a>
        <a href="/ja/legal.html#privacy" data-sm-legal-link="privacy">プライバシー</a>
        <a href="/ja/legal.html#contact" data-sm-legal-link="contact">問い合わせ</a>
    </footer>
  </div>
