<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 550" role="img" aria-labelledby="title desc">
<title id="title">AVERAGE SCORE RANKING</title><desc id="desc">Original fictional demonstration of three teams with scores for attack defense and teamwork. These are illustrative values, not real-world facts.</desc>
