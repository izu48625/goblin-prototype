<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101f">
  <title>Stats Maker V2</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
<header class="app-header">
  <div class="brand-wrap">
    <div class="brand-mark">S</div>
    <div>
      <div class="brand">STATS MAKER</div>
      <div class="brand-sub">Data → Visual</div>
    </div>
  </div>
  <div class="header-actions">
    <button id="langBtn" class="btn ghost compact">🌐 JA</button>
  </div>
</header>

<main class="home-shell">
  <section class="hero">
    <div class="hero-copy">
      <div class="eyebrow" data-i18n="home.eyebrow">DATA VISUAL MAKER</div>
      <h1 data-i18n="home.title">数字を、そのまま使えるビジュアルへ。</h1>
      <p data-i18n="home.desc">ランキング、能力カード、4象限マップを、ログインなしで作成・保存・画像化できます。</p>
    </div>
  </section>

  <section class="section-block">
    <div class="section-head">
      <div>
        <div class="eyebrow" data-i18n="home.createEyebrow">CREATE</div>
        <h2 data-i18n="home.createTitle">何を作りますか？</h2>
      </div>
    </div>
    <div id="createGrid" class="template-grid"></div>
  </section>

  <section class="section-block">
    <div class="section-head">
      <div>
        <div class="eyebrow" data-i18n="home.projectsEyebrow">LOCAL FIRST</div>
        <h2 data-i18n="home.projectsTitle">My Projects</h2>
      </div>
    </div>
    <div id="projectGrid" class="project-grid"></div>
    <div id="emptyProjects" class="empty-state hidden">
      <div class="empty-icon">✦</div>
      <div data-i18n="home.empty">まだProjectはありません。上から作成してください。</div>
    </div>
  </section>
</main>

<script type="module" src="js/home.js"></script>
</body>
</html>
