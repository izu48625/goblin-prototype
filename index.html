<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<title>Stats Maker</title>
<style>
:root{--bg:#07101f;--text:#edf4ff;--muted:#8da2be}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
button{font:inherit}
.hidden{display:none!important}
#basicRoot{position:fixed;inset:0;background:var(--bg)}
#basicFrame{display:block;width:100%;height:100%;border:0;background:var(--bg)}

#extLauncher{
  position:fixed;z-index:105;right:24px;bottom:calc(28px + env(safe-area-inset-bottom));
  width:236px;min-height:68px;border:1px solid #82a8ff;border-radius:18px;
  background:linear-gradient(135deg,#5f8dff,#3e69d8);color:#fff;
  display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;
  box-shadow:0 18px 48px rgba(36,79,184,.48),0 0 0 5px rgba(95,141,255,.12)
}
#extLauncher:hover{transform:translateY(-2px)}
#extLauncher:active{transform:scale(.985)}
.launchIcon{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.15);font-size:28px}
.launchCopy{flex:1;text-align:center;min-width:0}
.launchTitle{display:block;font-size:16px;font-weight:950}
.launchSub{display:block;margin-top:2px;color:#dce8ff;font-size:10px;font-weight:800}

#extBackdrop{position:fixed;inset:0;z-index:120;background:rgba(2,8,18,.66);backdrop-filter:blur(7px);display:flex;align-items:flex-end}
#extSheet{width:100%;max-height:min(82dvh,820px);overflow:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom));color:var(--text);background:#091526;border:1px solid #29405d;border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -25px 70px rgba(0,0,0,.52)}
.extHandle{width:48px;height:5px;margin:0 auto 10px;border-radius:999px;background:#46617f}
.extHead{position:sticky;top:-10px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:14px;background:#091526;padding:10px 0 12px;border-bottom:1px solid rgba(72,100,133,.35)}
.extHead h2{margin:0;font-size:22px}
.extHead p{margin:4px 0 0;color:var(--muted);font-size:11px}
.extActions{display:flex;align-items:center;gap:8px;flex:none}
.langSwitch{display:flex;align-items:center;padding:4px;border:1px solid #304a69;border-radius:10px;background:#0d1c31}
.langSwitch button{min-width:42px;height:34px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:#8da2be;font-weight:900;cursor:pointer}
.langSwitch button.active{background:#315da2;color:#fff}
#extClose{width:42px;height:42px;border:1px solid #304a69;border-radius:10px;background:#102039;color:#e2ebf7;font-size:20px;cursor:pointer}
.extGroup{margin:18px 0}
.extGroupTitle{margin-bottom:8px;color:#7190b8;font-size:10px;font-weight:950;letter-spacing:.13em;text-transform:uppercase}
.extGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.extCard{min-height:92px;padding:13px;border:1px solid #29425f;border-radius:14px;background:linear-gradient(180deg,#102039,#0c192b);color:#fff;text-align:left;cursor:pointer}
.extCard:hover{transform:translateY(-2px);border-color:#5076aa;background:#132641}
.extCard:active{transform:scale(.985)}
.extCard b{display:block;font-size:13px}
.extCard span{display:block;margin-top:6px;color:#8ea3be;font-size:10px;line-height:1.45}

@media(max-width:900px){.extGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){
  /* Compact mobile launcher: preserve tap comfort without consuming a full-width footer. */
  #basicRoot{bottom:calc(56px + env(safe-area-inset-bottom))}
  #extLauncher{
    right:10px;left:10px;
    bottom:calc(7px + env(safe-area-inset-bottom));
    width:auto;min-height:44px;
    border-radius:999px;
    padding:6px 10px;
    gap:0;
    justify-content:center;
    box-shadow:0 12px 32px rgba(36,79,184,.42),0 0 0 3px rgba(95,141,255,.09)
  }
  .launchIcon{position:absolute;left:10px;width:30px;height:30px;border-radius:999px;font-size:21px}
  .launchCopy{width:100%;text-align:center}
  .launchTitle{font-size:13px}
  .launchSub{display:none}
  #extSheet{padding-left:12px;padding-right:12px}
  .extHead h2{font-size:19px}
  .extGrid{grid-template-columns:1fr 1fr;gap:8px}
  .extCard{min-height:82px;padding:11px}
  .extHead{align-items:flex-start}
}
@media(max-width:390px){.extGrid{grid-template-columns:1fr}}

/* The Community screen is exactly the Home shell and table, with a submit bar. */
.communityControls{position:fixed;z-index:110;left:10px;right:10px;bottom:calc(74px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;padding:9px 12px;border:1px solid #345775;border-radius:14px;background:#0c1b30;box-shadow:0 10px 28px rgba(0,0,0,.35);color:#dce9fb}
.communityHead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;font-weight:850}
.communityHead a{color:#a5c5ff;text-decoration:none}
.communityButtons{display:grid;grid-template-columns:1fr 1.35fr;gap:7px}
.communityButtons button{min-height:40px;border-radius:9px;border:1px solid #4b6996;background:#1a3458;color:white;font-weight:850;font-size:12px}
.communityButtons button.primary{background:#3465bd}
.communityButtons button:disabled{opacity:.6}
.communityMessage{font-size:11px;color:#b9c9df;min-height:12px}
.communityMessage.ok{color:#72e2ab}
.communityMessage.error{color:#ff9595}
.communityLoading{position:fixed;inset:0;z-index:111;display:grid;place-items:center;background:#07101f;color:#b6cbeb;font-size:15px;text-align:center;padding:20px}
.communityLoading.error{color:#ff9b9b}
body.communityShell #basicRoot{bottom:calc(178px + env(safe-area-inset-bottom))}
body.communityShell #extLauncher{bottom:calc(8px + env(safe-area-inset-bottom))}
@media(min-width:601px){
 .communityControls{left:50%;right:auto;transform:translateX(-50%);width:min(560px,calc(100% - 30px));bottom:20px}
 body.communityShell #basicRoot{bottom:112px}
 body.communityShell #extLauncher{bottom:20px}
}
</style>
<link rel="stylesheet" href="cloud/global-locale.css?v=r27lang1">
</head>
<body data-build="R25-P4" class="homeHost">
<div id="basicRoot"><iframe id="basicFrame" title="Stats Maker"></iframe></div>
<script>
(() => {
  const topic = new URLSearchParams(location.search).get('community')||'';
  const valid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(topic);
  if(valid)document.body.classList.add('communityShell');
  document.getElementById('basicFrame').src='base/index.html?v=r27r1'+(valid?'&community='+encodeURIComponent(topic):'');
})();
</script>
<div id="communityLoading" class="communityLoading hidden">Communityを読み込み中…</div>
<div id="communityControls" class="communityControls hidden">
  <div class="communityHead"><a id="communityBackLink" href="public.html">← 公開ページへ戻る</a><span id="communityParticipant">Community</span></div>
  <div id="communityMessage" class="communityMessage">自分の点数を入力して投稿できます。</div>
  <div class="communityButtons"><button type="button" id="communityDraft">下書き保存</button><button type="button" id="communitySubmit" class="primary">Communityへ投稿</button></div>
</div>
<script>
if(document.body.classList.contains('communityShell'))document.getElementById('communityLoading').classList.remove('hidden');
</script>

<button id="extLauncher" type="button">
  <span class="launchIcon">＋</span>
  <span class="launchCopy">
    <span id="launcherTitle" class="launchTitle">拡張機能</span>
    <span id="launcherSub" class="launchSub">グラフ・カードを作る</span>
  </span>
</button>

<div id="extBackdrop" class="hidden">
  <section id="extSheet">
    <div class="extHandle"></div>
    <div class="extHead">
      <div>
        <h2 id="pickerTitle">拡張機能</h2>
        <p id="pickerDesc">基本表の対象・画像・評価項目・点数をそのまま使います。</p>
      </div>
      <div class="extActions">
        <button id="extClose" type="button">×</button>
      </div>
    </div>
    <div id="extGroups"></div>
  </section>
</div>

<script type="module" src="app/src/launcher.js?v=r27lang1"></script>
<script type="module" src="cloud/community-home.js?v=r27lang1"></script>
<script src="cloud/global-locale.js?v=r27lang1"></script>
</body>
</html>
