<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Stats Maker V0.2</title>
  <style>
    /* =========================================================
       STATS MAKER V0.2
       01. Tokens / Base
       02. Header
       03. Spreadsheet
       04. Sidebar
       05. Ranking
       06. Compare / Radar
       07. Mobile
       ========================================================= */

    :root{
      --bg:#07101f;
      --panel:#0d1728;
      --panel2:#111d31;
      --panel3:#152238;
      --text:#eef4ff;
      --muted:#93a3ba;
      --line:#263750;
      --line2:#31445f;
      --accent:#5d8cff;
      --accent2:#7ba1ff;
      --danger:#ff6b7d;
      --green:#54d89a;
      --yellow:#f2c860;
      --orange:#f39a62;
      --purple:#ae8dff;
      --shadow:0 12px 28px rgba(0,0,0,.18);
      --radius:16px;
    }

    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0;
      min-width:320px;
      background:
        radial-gradient(circle at 100% 0%, rgba(93,140,255,.08), transparent 30%),
        var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.45}
    input,textarea,select{color:var(--text)}
    input::placeholder,textarea::placeholder{color:#60718a}

    .app{
      width:min(1480px,100%);
      margin:0 auto;
      padding:12px 12px max(20px,env(safe-area-inset-bottom));
    }

    .panel{
      background:linear-gradient(180deg,rgba(17,29,49,.96),rgba(13,23,40,.96));
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }

    .btn{
      min-height:42px;
      border:1px solid var(--line2);
      border-radius:11px;
      padding:0 13px;
      background:#132139;
      color:var(--text);
      font-weight:750;
      font-size:13px;
      white-space:nowrap;
    }
    .btn:hover{border-color:#4c6687}
    .btn.primary{
      background:linear-gradient(180deg,#668fff,#4f79e6);
      border-color:#6f98ff;
      color:white;
    }
    .btn.ghost{background:transparent}
    .btn.danger{color:#ff9aa7}
    .btn.small{min-height:36px;padding:0 10px;font-size:12px}

    /* 02. Header */
    .topbar{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      margin-bottom:10px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:9px;
      min-width:0;
    }
    .brandMark{
      width:32px;height:32px;border-radius:10px;
      display:grid;place-items:center;
      background:linear-gradient(145deg,#5d8cff,#8d74ff);
      font-weight:900;
      letter-spacing:-.04em;
      box-shadow:0 7px 18px rgba(93,140,255,.25);
      flex:0 0 auto;
    }
    .brandText{min-width:0}
    .brandTitle{font-size:14px;font-weight:900;line-height:1}
    .brandSub{font-size:10px;color:var(--muted);margin-top:4px}

    .docMeta{
      flex:1;
      min-width:160px;
      padding:0 4px;
    }
    .titleInput,.descInput{
      width:100%;
      border:0;
      outline:0;
      background:transparent;
      padding:0;
    }
    .titleInput{font-size:18px;font-weight:900;letter-spacing:-.02em}
    .descInput{margin-top:2px;font-size:12px;color:var(--muted)}
    .topActions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

    /* Workspace */
    .workspace{
      display:grid;
      grid-template-columns:minmax(0,1fr) 300px;
      gap:10px;
      align-items:start;
    }

    /* 03. Spreadsheet */
    .sheetPanel{min-width:0;overflow:hidden}
    .sheetToolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:9px 10px;
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.012);
    }
    .toolLeft,.toolRight{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .sheetLabel{font-size:13px;font-weight:900}
    .hint{font-size:10px;color:var(--muted)}

    .tableWrap{
      width:100%;
      overflow:auto;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
    }

    table{
      width:max-content;
      min-width:100%;
      border-collapse:separate;
      border-spacing:0;
      font-size:13px;
    }

    th,td{
      height:46px;
      border-right:1px solid var(--line);
      border-bottom:1px solid var(--line);
      padding:0;
      background:#0f1a2d;
      position:relative;
    }

    thead th{
      position:sticky;
      top:0;
      z-index:15;
      background:#142139;
      color:#dfe9f9;
      font-size:11px;
      font-weight:850;
    }

    tbody tr:last-child td{border-bottom:0}
    th:last-child,td:last-child{border-right:0}

    .indexHead,.indexCell{
      width:42px;min-width:42px;text-align:center;color:#6f819b;
      position:sticky;left:0;z-index:18;
      background:#101b2f;
    }
    .indexHead{z-index:25;background:#142139}

    .nameHead,.nameCell{
      width:190px;min-width:190px;
      position:sticky;left:42px;z-index:17;
      background:#101b2f;
    }
    .nameHead{z-index:24;background:#142139}

    .nameInput,.colInput,.scoreInput{
      width:100%;height:100%;
      border:0;outline:0;
      background:transparent;
      color:inherit;
    }
    .nameInput{padding:0 12px;font-weight:800}
    .colInput{
      padding:0 38px 0 10px;
      text-align:center;
      font-size:11px;
      font-weight:850;
    }

    .metricHead{min-width:112px;width:112px}
    .headSort{
      position:absolute;
      top:50%;right:3px;transform:translateY(-50%);
      width:32px;height:32px;
      border:0;border-radius:8px;
      background:transparent;color:#8ea0b8;
      font-size:13px;
    }
    .headSort:hover{background:#1b2b46;color:#fff}
    .headSort.active{color:#8fb0ff;background:#1a2b4b}

    .scoreCell{
      min-width:112px;
      text-align:center;
      background:#0f1a2d;
      transition:background .12s ease;
    }
    .scoreInput{
      text-align:center;
      font-weight:850;
      font-size:15px;
      appearance:textfield;
      -moz-appearance:textfield;
    }
    .scoreInput::-webkit-inner-spin-button,
    .scoreInput::-webkit-outer-spin-button{appearance:none;margin:0}

    .scoreInput:focus,.nameInput:focus,.colInput:focus{
      box-shadow:inset 0 0 0 2px var(--accent);
      background:#172845;
    }

    .avgHead,.avgCell{width:86px;min-width:86px;text-align:center}
    .avgCell{background:#121f34}
    .avgValue{font-weight:950;font-size:15px}
    .grade{display:block;font-size:9px;font-weight:900;color:var(--muted);margin-top:1px}

    .deleteHead,.deleteCell{width:42px;min-width:42px;text-align:center}
    .rowDelete,.colDelete{
      border:0;background:transparent;color:#64758e;
      width:32px;height:32px;border-radius:8px;
    }
    .rowDelete:hover,.colDelete:hover{background:#2a1a25;color:#ff8d9b}

    .emptyAddRow{
      padding:8px;
      border-top:1px solid var(--line);
      background:#0d1728;
    }

    /* score heat colors */
    .heat-e{background:rgba(84,102,128,.08)}
    .heat-d{background:rgba(81,128,178,.10)}
    .heat-c{background:rgba(87,145,211,.12)}
    .heat-b{background:rgba(84,180,178,.13)}
    .heat-a{background:rgba(242,200,96,.14)}
    .heat-s{background:rgba(243,154,98,.17)}
    .heat-ss{background:rgba(255,107,125,.18)}

    /* 04. Sidebar */
    .side{
      display:grid;
      gap:10px;
      position:sticky;
      top:10px;
    }
    .sidePanel{padding:11px}
    .sectionTop{
      display:flex;justify-content:space-between;align-items:center;
      gap:8px;margin-bottom:9px;
    }
    .eyebrow{
      color:var(--muted);font-size:9px;font-weight:900;
      letter-spacing:.16em;text-transform:uppercase;
    }
    .sectionTitle{font-size:13px;font-weight:900;margin-top:2px}
    .select{
      min-height:36px;
      max-width:150px;
      border:1px solid var(--line2);
      border-radius:9px;
      background:#132139;
      padding:0 8px;
      font-size:11px;
      outline:0;
    }

    /* 05. Ranking */
    .ranking{display:grid;gap:5px}
    .rankRow{
      display:grid;
      grid-template-columns:24px minmax(0,1fr) 44px;
      gap:7px;align-items:center;
      min-height:38px;
      padding:5px 7px;
      border:1px solid var(--line);
      border-radius:9px;
      background:#101c30;
    }
    .rankNo{
      font-size:13px;font-weight:950;text-align:center;color:#a6b6cb;
    }
    .rankName{
      min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      font-size:11px;font-weight:800;
    }
    .rankScore{text-align:right;font-size:13px;font-weight:950}
    .rankGrade{font-size:8px;color:var(--muted);font-weight:900;display:block}

    /* 06. Compare / Radar */
    .chips{display:flex;gap:5px;flex-wrap:wrap}
    .chip{
      min-height:32px;
      border:1px solid var(--line);
      border-radius:9px;
      background:#101c30;
      color:#b9c8db;
      padding:0 8px;
      font-size:10px;
      font-weight:800;
      max-width:100%;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .chip.active{
      border-color:#6d95ff;
      background:#172a4a;
      color:#fff;
    }

    .compareLegend{
      display:flex;gap:8px;flex-wrap:wrap;
      margin:8px 0 3px;
      font-size:9px;color:#a7b7ca;
    }
    .legendItem{display:flex;align-items:center;gap:4px;min-width:0}
    .legendDot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
    .legendText{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:85px}

    .radarWrap{
      width:100%;
      aspect-ratio:1.2/1;
      min-height:210px;
      border-radius:12px;
      background:
        radial-gradient(circle at 50% 45%, rgba(93,140,255,.06), transparent 54%),
        #0d1829;
      border:1px solid var(--line);
      overflow:hidden;
    }
    #radarCanvas{width:100%;height:100%;display:block}

    .summaryGrid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:6px;
    }
    .summaryBox{
      border:1px solid var(--line);
      background:#101c30;
      border-radius:9px;
      padding:7px 4px;
      text-align:center;
    }
    .summaryValue{font-weight:950;font-size:15px}
    .summaryLabel{font-size:8px;color:var(--muted);margin-top:2px}

    .status{
      margin-top:8px;
      min-height:18px;
      color:#90a3bc;
      font-size:10px;
    }

    /* 07. Mobile */
    @media (max-width:980px){
      .workspace{grid-template-columns:1fr}
      .side{
        position:static;
        grid-template-columns:1fr 1fr;
      }
      .summaryPanel{grid-column:1/-1}
    }

    @media (max-width:680px){
      .app{padding:8px 7px max(16px,env(safe-area-inset-bottom))}
      .topbar{padding:9px;align-items:flex-start;flex-wrap:wrap}
      .brand{display:none}
      .docMeta{order:1;width:100%;flex-basis:100%;padding:0}
      .topActions{order:2;width:100%}
      .topActions .btn{flex:1}
      .titleInput{font-size:17px}
      .workspace{gap:8px}
      .sheetToolbar{align-items:flex-start}
      .toolRight .hint{display:none}
      .side{grid-template-columns:1fr}
      .summaryPanel{grid-column:auto}
      .nameHead,.nameCell{width:145px;min-width:145px}
      .metricHead,.scoreCell{width:96px;min-width:96px}
      .avgHead,.avgCell{width:76px;min-width:76px}
      .btn{min-height:40px}
      .sheetLabel{font-size:12px}
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar panel">
      <div class="brand">
        <div class="brandMark">S</div>
        <div class="brandText">
          <div class="brandTitle">STATS MAKER</div>
          <div class="brandSub">V0.2 · Single HTML Prototype</div>
        </div>
      </div>

      <div class="docMeta">
        <input id="titleInput" class="titleInput" value="ワンピース 各編評価" aria-label="お題">
        <input id="descInput" class="descInput" value="各編を100点満点で自由に採点" aria-label="説明">
      </div>

      <div class="topActions">
        <button id="sampleBtn" class="btn ghost" type="button">サンプル</button>
        <button id="newBtn" class="btn" type="button">新規シート</button>
      </div>
    </header>

    <div class="workspace">
      <section class="sheetPanel panel">
        <div class="sheetToolbar">
          <div class="toolLeft">
            <span class="sheetLabel">Score Sheet</span>
            <button id="addRowBtn" class="btn small" type="button">＋ 行</button>
            <button id="addColBtn" class="btn small" type="button">＋ 項目</button>
          </div>
          <div class="toolRight">
            <span class="hint">0〜100で入力 · 列名横の ↕ で並び替え</span>
          </div>
        </div>

        <div id="tableWrap" class="tableWrap">
          <table id="scoreTable" aria-label="採点表"></table>
        </div>
        <div class="emptyAddRow">
          <button id="addRowWideBtn" class="btn ghost" type="button" style="width:100%;">＋ 評価対象を追加</button>
        </div>
      </section>

      <aside class="side">
        <section class="sidePanel panel">
          <div class="sectionTop">
            <div>
              <div class="eyebrow">Ranking</div>
              <div class="sectionTitle">ランキング</div>
            </div>
            <select id="rankMetric" class="select" aria-label="ランキング項目"></select>
          </div>
          <div id="ranking" class="ranking"></div>
        </section>

        <section class="sidePanel panel">
          <div class="sectionTop">
            <div>
              <div class="eyebrow">Compare</div>
              <div class="sectionTitle">比較</div>
            </div>
            <button id="clearCompareBtn" class="btn small ghost" type="button">解除</button>
          </div>

          <div id="compareChips" class="chips"></div>
          <div id="compareLegend" class="compareLegend"></div>

          <div class="radarWrap">
            <canvas id="radarCanvas" aria-label="ステータス比較レーダーチャート"></canvas>
          </div>
          <div id="compareHint" class="status">最大3件まで選択できます。</div>
        </section>

        <section class="sidePanel panel summaryPanel">
          <div class="eyebrow">Sheet Summary</div>
          <div class="sectionTitle" style="margin-bottom:9px;">シート概要</div>
          <div class="summaryGrid">
            <div class="summaryBox">
              <div id="rowCount" class="summaryValue">0</div>
              <div class="summaryLabel">対象</div>
            </div>
            <div class="summaryBox">
              <div id="colCount" class="summaryValue">0</div>
              <div class="summaryLabel">評価項目</div>
            </div>
            <div class="summaryBox">
              <div id="topAverage" class="summaryValue">--</div>
              <div class="summaryLabel">最高平均</div>
            </div>
          </div>
          <div id="statusText" class="status">編集内容はこの画面内で即時反映されます。</div>
        </section>
      </aside>
    </div>
  </main>

  <script>
    /* =========================================================
       01. State / Helpers
       02. Spreadsheet
       03. Sorting / Ranking
       04. Compare / Radar
       05. Summary
       06. Actions / Events
       ========================================================= */

    (() => {
      'use strict';

      const $ = (id) => document.getElementById(id);
      const MAX_ROWS = 40;
      const MAX_COLS = 10;
      const MAX_COMPARE = 3;

      const DEFAULT_STATE = () => ({
        cols: ['ストーリー','戦闘','敵キャラ','感動','世界観'],
        rows: [
          { name:'東の海', scores:[88,80,82,91,84] },
          { name:'アラバスタ', scores:[94,92,95,94,92] },
          { name:'空島', scores:[91,84,87,89,98] },
          { name:'W7・エニエスロビー', scores:[98,97,94,99,93] },
          { name:'頂上戦争', scores:[97,99,99,99,97] }
        ],
        sortKey:null,
        sortDesc:true,
        rankMetric:'avg',
        compare:[1,2,4]
      });

      let state = DEFAULT_STATE();

      const clampScore = (value) => {
        if (value === '' || value === null || value === undefined) return null;
        const n = Number(value);
        if (!Number.isFinite(n)) return null;
        return Math.max(0, Math.min(100, Math.round(n)));
      };

      const avg = (row) => {
        const vals = row.scores.filter(v => Number.isFinite(v));
        if (!vals.length) return null;
        return vals.reduce((a,b) => a+b,0) / vals.length;
      };

      const fmt = (v) => v == null ? '--' : Number(v).toFixed(1).replace('.0','');

      const grade = (v) => {
        if (v == null) return '–';
        if (v >= 95) return 'SS';
        if (v >= 90) return 'S';
        if (v >= 80) return 'A';
        if (v >= 70) return 'B';
        if (v >= 60) return 'C';
        if (v >= 50) return 'D';
        return 'E';
      };

      const heatClass = (v) => {
        if (v == null) return '';
        if (v >= 95) return 'heat-ss';
        if (v >= 90) return 'heat-s';
        if (v >= 80) return 'heat-a';
        if (v >= 70) return 'heat-b';
        if (v >= 60) return 'heat-c';
        if (v >= 50) return 'heat-d';
        return 'heat-e';
      };

      const escapeHtml = (s) => String(s).replace(/[&<>"']/g, ch => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[ch]));

      const metricLabel = (key) => {
        if (key === 'avg') return '総合平均';
        const idx = Number(key);
        return state.cols[idx] || `評価${idx+1}`;
      };

      const getMetricValue = (row, key) => {
        if (key === 'avg') return avg(row);
        return row.scores[Number(key)] ?? null;
      };

      const setStatus = (text) => {
        $('statusText').textContent = text;
      };

      /* 02. Spreadsheet */

      function orderedRows(){
        const list = state.rows.map((row, index) => ({ row, index }));
        if (state.sortKey === null) return list;

        list.sort((a,b) => {
          const av = getMetricValue(a.row, state.sortKey);
          const bv = getMetricValue(b.row, state.sortKey);
          const aa = av == null ? -1 : av;
          const bb = bv == null ? -1 : bv;
          return state.sortDesc ? bb-aa : aa-bb;
        });
        return list;
      }

      function renderTable(){
        const rows = orderedRows();

        let html = '<thead><tr>';
        html += '<th class="indexHead">#</th>';
        html += '<th class="nameHead">対象</th>';

        state.cols.forEach((name, colIndex) => {
          const active = String(state.sortKey) === String(colIndex) ? ' active' : '';
          const arrow = String(state.sortKey) === String(colIndex)
            ? (state.sortDesc ? '↓' : '↑')
            : '↕';

          html += `
            <th class="metricHead">
              <input class="colInput" data-col-name="${colIndex}" value="${escapeHtml(name)}" aria-label="評価項目名">
              <button class="headSort${active}" data-sort="${colIndex}" type="button" aria-label="${escapeHtml(name)}で並び替え">${arrow}</button>
            </th>`;
        });

        const avgActive = state.sortKey === 'avg' ? ' active' : '';
        const avgArrow = state.sortKey === 'avg' ? (state.sortDesc ? '↓' : '↑') : '↕';
        html += `
          <th class="avgHead">
            平均
            <button class="headSort${avgActive}" data-sort="avg" type="button" aria-label="平均で並び替え">${avgArrow}</button>
          </th>`;
        html += '<th class="deleteHead"></th></tr></thead><tbody>';

        rows.forEach(({row,index}, displayIndex) => {
          const average = avg(row);
          html += '<tr>';
          html += `<td class="indexCell">${displayIndex+1}</td>`;
          html += `
            <td class="nameCell">
              <input class="nameInput" data-row-name="${index}" value="${escapeHtml(row.name)}" placeholder="対象名">
            </td>`;

          state.cols.forEach((_, colIndex) => {
            const value = row.scores[colIndex];
            html += `
              <td class="scoreCell ${heatClass(value)}">
                <input
                  class="scoreInput"
                  data-score-row="${index}"
                  data-score-col="${colIndex}"
                  type="number"
                  inputmode="numeric"
                  min="0"
                  max="100"
                  value="${value == null ? '' : value}"
                  placeholder="–"
                  aria-label="${escapeHtml(row.name || `対象${index+1}`)} ${escapeHtml(state.cols[colIndex] || `評価${colIndex+1}`)}">
              </td>`;
          });

          html += `
            <td class="avgCell ${heatClass(average)}">
              <span class="avgValue">${fmt(average)}</span>
              <span class="grade">${grade(average)}</span>
            </td>
            <td class="deleteCell">
              <button class="rowDelete" data-delete-row="${index}" type="button" aria-label="行を削除">×</button>
            </td>`;
          html += '</tr>';
        });

        html += '</tbody>';
        $('scoreTable').innerHTML = html;

        document.querySelectorAll('[data-row-name]').forEach(input => {
          input.addEventListener('input', (e) => {
            const rowIndex = Number(e.currentTarget.dataset.rowName);
            state.rows[rowIndex].name = e.currentTarget.value;
            renderSidebarOnly();
          });
        });

        document.querySelectorAll('[data-col-name]').forEach(input => {
          input.addEventListener('change', (e) => {
            const colIndex = Number(e.currentTarget.dataset.colName);
            state.cols[colIndex] = e.currentTarget.value.trim() || `評価${colIndex+1}`;
            renderSidebarOnly();
            renderTable();
          });
        });

        document.querySelectorAll('[data-score-row]').forEach(input => {
          input.addEventListener('change', (e) => {
            const rowIndex = Number(e.currentTarget.dataset.scoreRow);
            const colIndex = Number(e.currentTarget.dataset.scoreCol);
            state.rows[rowIndex].scores[colIndex] = clampScore(e.currentTarget.value);
            renderAll();
          });
        });

        document.querySelectorAll('[data-sort]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const raw = e.currentTarget.dataset.sort;
            sortBy(raw === 'avg' ? 'avg' : Number(raw));
          });
        });

        document.querySelectorAll('[data-delete-row]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const idx = Number(e.currentTarget.dataset.deleteRow);
            if (state.rows.length <= 1) {
              setStatus('最後の1行は削除できません。');
              return;
            }
            state.rows.splice(idx,1);
            state.compare = state.compare
              .filter(i => i !== idx)
              .map(i => i > idx ? i-1 : i);
            renderAll();
            setStatus('行を削除しました。');
          });
        });
      }

      /* 03. Sorting / Ranking */

      function sortBy(key){
        if (state.sortKey === key) state.sortDesc = !state.sortDesc;
        else {
          state.sortKey = key;
          state.sortDesc = true;
        }
        renderTable();
        renderRanking();
        setStatus(`${metricLabel(key)}で${state.sortDesc ? '降順' : '昇順'}に並び替えました。`);
      }

      function renderRanking(){
        $('rankMetric').innerHTML =
          '<option value="avg">総合平均</option>' +
          state.cols.map((name,i) => `<option value="${i}">${escapeHtml(name || `評価${i+1}`)}</option>`).join('');

        $('rankMetric').value = String(state.rankMetric);

        const list = state.rows.map((row,index) => ({
          index,
          name: row.name.trim() || `対象${index+1}`,
          value: getMetricValue(row,state.rankMetric)
        })).sort((a,b) => (b.value ?? -1) - (a.value ?? -1));

        $('ranking').innerHTML = list.map((item,rank) => `
          <div class="rankRow">
            <div class="rankNo">${rank+1}</div>
            <div class="rankName">${escapeHtml(item.name)}</div>
            <div class="rankScore">
              ${fmt(item.value)}
              <span class="rankGrade">${grade(item.value)}</span>
            </div>
          </div>`).join('');
      }

      /* 04. Compare / Radar */

      function renderCompareChips(){
        $('compareChips').innerHTML = state.rows.map((row,index) => {
          const active = state.compare.includes(index) ? ' active' : '';
          const label = row.name.trim() || `対象${index+1}`;
          return `<button class="chip${active}" data-compare="${index}" type="button">${escapeHtml(label)}</button>`;
        }).join('');

        document.querySelectorAll('[data-compare]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const idx = Number(e.currentTarget.dataset.compare);
            if (state.compare.includes(idx)) {
              state.compare = state.compare.filter(i => i !== idx);
            } else {
              if (state.compare.length >= MAX_COMPARE) {
                $('compareHint').textContent = `比較は最大${MAX_COMPARE}件までです。`;
                return;
              }
              state.compare.push(idx);
            }
            renderCompare();
          });
        });
      }

      function renderCompare(){
        renderCompareChips();

        const palette = ['#6f98ff','#54d89a','#f2c860'];

        $('compareLegend').innerHTML = state.compare.map((rowIndex,i) => {
          const label = state.rows[rowIndex]?.name.trim() || `対象${rowIndex+1}`;
          return `
            <div class="legendItem">
              <span class="legendDot" style="background:${palette[i]}"></span>
              <span class="legendText">${escapeHtml(label)}</span>
            </div>`;
        }).join('');

        $('compareHint').textContent = state.compare.length
          ? `${state.compare.length}件を比較中。対象名をタップすると解除できます。`
          : `最大${MAX_COMPARE}件まで選択できます。`;

        drawRadar();
      }

      function drawRadar(){
        const canvas = $('radarCanvas');
        const rect = canvas.getBoundingClientRect();
        const cssWidth = Math.max(220, rect.width || 260);
        const cssHeight = Math.max(210, rect.height || 230);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.round(cssWidth * dpr);
        canvas.height = Math.round(cssHeight * dpr);
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr,0,0,dpr,0,0);
        ctx.clearRect(0,0,cssWidth,cssHeight);

        const cols = state.cols;
        if (!cols.length) return;

        const cx = cssWidth/2;
        const cy = cssHeight/2 + 4;
        const radius = Math.min(cssWidth,cssHeight) * 0.31;
        const n = cols.length;
        const start = -Math.PI/2;

        const point = (index, scale) => {
          const angle = start + (Math.PI*2*index/n);
          return {
            x: cx + Math.cos(angle)*radius*scale,
            y: cy + Math.sin(angle)*radius*scale
          };
        };

        // grid
        ctx.lineWidth = 1;
        for(let level=1; level<=4; level++){
          const scale = level/4;
          ctx.beginPath();
          for(let i=0;i<n;i++){
            const p = point(i,scale);
            if(i===0)ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
          }
          ctx.closePath();
          ctx.strokeStyle = level===4 ? '#40536d' : '#27384e';
          ctx.stroke();
        }

        // axes + labels
        ctx.font = '10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillStyle = '#9aaac0';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        for(let i=0;i<n;i++){
          const p = point(i,1);
          ctx.beginPath();
          ctx.moveTo(cx,cy);
          ctx.lineTo(p.x,p.y);
          ctx.strokeStyle = '#28394f';
          ctx.stroke();

          const labelP = point(i,1.22);
          let label = cols[i] || `評価${i+1}`;
          if(label.length > 7) label = label.slice(0,7) + '…';
          ctx.fillText(label,labelP.x,labelP.y);
        }

        if(!state.compare.length){
          ctx.fillStyle = '#73859e';
          ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
          ctx.fillText('比較する対象を選択',cx,cy);
          return;
        }

        const palette = [
          {stroke:'#6f98ff', fill:'rgba(111,152,255,.16)'},
          {stroke:'#54d89a', fill:'rgba(84,216,154,.12)'},
          {stroke:'#f2c860', fill:'rgba(242,200,96,.12)'}
        ];

        state.compare.forEach((rowIndex, seriesIndex) => {
          const row = state.rows[rowIndex];
          const style = palette[seriesIndex];
          ctx.beginPath();

          cols.forEach((_,i) => {
            const v = row?.scores?.[i];
            const scale = (Number.isFinite(v) ? v : 0) / 100;
            const p = point(i,scale);
            if(i===0)ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
          });

          ctx.closePath();
          ctx.fillStyle = style.fill;
          ctx.fill();
          ctx.strokeStyle = style.stroke;
          ctx.lineWidth = 2;
          ctx.stroke();

          cols.forEach((_,i) => {
            const v = row?.scores?.[i];
            const scale = (Number.isFinite(v) ? v : 0) / 100;
            const p = point(i,scale);
            ctx.beginPath();
            ctx.arc(p.x,p.y,2.5,0,Math.PI*2);
            ctx.fillStyle = style.stroke;
            ctx.fill();
          });
        });
      }

      /* 05. Summary */

      function renderSummary(){
        $('rowCount').textContent = state.rows.length;
        $('colCount').textContent = state.cols.length;
        const avgs = state.rows.map(avg).filter(v => v != null);
        $('topAverage').textContent = avgs.length ? fmt(Math.max(...avgs)) : '--';
      }

      function renderSidebarOnly(){
        renderRanking();
        renderCompare();
        renderSummary();
      }

      function renderAll(){
        renderTable();
        renderSidebarOnly();
      }

      /* 06. Actions / Events */

      function addRow(){
        if(state.rows.length >= MAX_ROWS){
          setStatus(`行は最大${MAX_ROWS}件までです。`);
          return;
        }
        state.rows.push({
          name:'',
          scores:Array(state.cols.length).fill(null)
        });
        renderAll();
        setStatus('評価対象を1件追加しました。');
      }

      function addColumn(){
        if(state.cols.length >= MAX_COLS){
          setStatus(`評価項目は最大${MAX_COLS}個までです。`);
          return;
        }
        state.cols.push(`評価${state.cols.length+1}`);
        state.rows.forEach(row => row.scores.push(null));
        renderAll();
        setStatus('評価項目を1つ追加しました。');
      }

      function newSheet(){
        $('titleInput').value = '新しいお題';
        $('descInput').value = '';
        state = {
          cols:['評価1','評価2','評価3','評価4'],
          rows:[
            {name:'',scores:[null,null,null,null]},
            {name:'',scores:[null,null,null,null]},
            {name:'',scores:[null,null,null,null]},
            {name:'',scores:[null,null,null,null]}
          ],
          sortKey:null,
          sortDesc:true,
          rankMetric:'avg',
          compare:[]
        };
        renderAll();
        setStatus('新しいシートを作成しました。');
      }

      function loadSample(){
        $('titleInput').value = 'ワンピース 各編評価';
        $('descInput').value = '各編を100点満点で自由に採点';
        state = DEFAULT_STATE();
        renderAll();
        setStatus('サンプルデータを読み込みました。');
      }

      $('addRowBtn').addEventListener('click',addRow);
      $('addRowWideBtn').addEventListener('click',addRow);
      $('addColBtn').addEventListener('click',addColumn);
      $('newBtn').addEventListener('click',newSheet);
      $('sampleBtn').addEventListener('click',loadSample);

      $('rankMetric').addEventListener('change',(e)=>{
        const raw = e.currentTarget.value;
        state.rankMetric = raw === 'avg' ? 'avg' : Number(raw);
        renderRanking();
      });

      $('clearCompareBtn').addEventListener('click',()=>{
        state.compare = [];
        renderCompare();
      });

      window.addEventListener('resize',()=>{
        window.clearTimeout(window.__statsMakerResizeTimer);
        window.__statsMakerResizeTimer = window.setTimeout(drawRadar,100);
      });

      renderAll();
    })();
  </script>
</body>
</html>
