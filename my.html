<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101f">
  <meta name="robots" content="noindex,nofollow">
  <title>My Page - Stats Maker</title>
  <link rel="stylesheet" href="cloud/my.css?v=r31simple1">
  <link rel="stylesheet" href="cloud/global-locale.css?v=r31nav1">
<link rel="stylesheet" href="cloud/ad-layout.css?v=r32ad1">
</head>
<body data-sm-ad-page="works">
  <header class="topbar">
    <a class="brand" href="index.html?v=r25p3" aria-label="Stats Makerへ戻る">
      <span class="brandMark">S</span>
      <span>
        <b>STATS MAKER</b>
        <small id="brandSub">My Page</small>
      </span>
    </a>
    <div class="headActions">

      <a id="backBtn" class="btn ghost" href="index.html?v=r25p3">編集へ戻る</a>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <div>
        <div class="eyebrow">MY WORKS</div>
        <h1 id="pageTitle">自分の公開作品</h1>
        <p id="pageLead">このブラウザから公開した作品を確認・管理できます。</p>
      </div>
      <button id="refreshBtn" class="btn" type="button">更新</button>
    </section>

    <div id="browserNotice" class="notice browserNotice">
      作品の管理情報はこのブラウザに保存されます。ブラウザデータを削除すると編集できなくなる場合があります。
    </div>
    <div id="myStatus" class="status" role="status" aria-live="polite"></div>

    <section class="summaryGrid" aria-label="Work summary">
      <div class="summaryCard"><b id="countAll">0</b><span id="countAllLabel">全作品</span></div>
      <div class="summaryCard"><b id="countPublic">0</b><span>Public</span></div>
      <div class="summaryCard"><b id="countUnlisted">0</b><span>Unlisted</span></div>
      <div class="summaryCard"><b id="countPrivate">0</b><span>Private</span></div>
    </section>

    <section class="worksSection panel">
      <div class="sectionHead">
        <div>
          <div class="eyebrow">CLOUD WORKS</div>
          <h2 id="worksTitle">自分の公開作品</h2>
        </div>
        <div class="filterRow">
          <button class="filterBtn active" type="button" data-filter="all">All</button>
          <button class="filterBtn" type="button" data-filter="public">Public</button>
          <button class="filterBtn" type="button" data-filter="unlisted">Unlisted</button>
          <button class="filterBtn" type="button" data-filter="private">Private</button>
        </div>
      </div>

      <div id="worksStatus" class="worksStatus">読み込み中…</div>
      <div id="worksGrid" class="worksGrid hidden"></div>
      <div id="emptyState" class="emptyState hidden">
        <b id="emptyTitle">まだ作品がありません</b>
        <span id="emptyHelp">Stats Makerから作品を公開すると、ここで管理できます。</span>
        <a id="emptyBackBtn" class="btn primary" href="index.html?v=r25p3">Stats Makerを開く</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud/runtime-config.js?v=r25p3"></script>
  <script src="cloud/supabase.js?v=r25p3"></script>
  <script src="cloud/my.js?v=r31simple1"></script>
<script src="cloud/global-locale.js?v=r31nav2"></script>
<script src="cloud/ad-layout.js?v=r32ad1"></script>
</body>
</html>
